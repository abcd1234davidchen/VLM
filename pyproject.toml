[project]
name = "vlm"
version = "0.1.0"
description = "CLIP and XCLIP video-classification toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tqdm>=4.67.0",
    "av>=17.0.1",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "requests>=2.32.5",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "matplotlib>=3.11.0",
]

[project.scripts]
vlm = "vlm.cli:entrypoint"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
